# 推 tag v* 时自动: 自测 → 发 npm → 建 GitHub Release
# 首次使用需在仓库 Settings → Secrets and variables → Actions 添加 NPM_TOKEN:
#   在 https://www.npmjs.com/settings/<你的账号>/tokens 创建 granular access token,
#   勾选对 dsh-export-plugin 的 publish 权限, 然后把它作为 NPM_TOKEN secret 存入仓库。
name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Self-test (static checks)
        run: node test-inject.mjs

      - name: Publish to npm (only when NPM_TOKEN is set)
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
